apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gw
  namespace: demo
  annotations:
    # Hypothesis: Istio's Gateway API deployment copies these annotations to the generated Service.
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: demo
spec:
  parentRefs:
    - name: internal-gw
  rules:
    - backendRefs:
        - name: echo
          port: 80
